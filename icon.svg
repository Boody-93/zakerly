<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>

  <!-- Tilted Flashcard Behind -->
  <rect x="170" y="90" width="220" height="300" rx="28" fill="rgba(255,255,255,0.18)" transform="rotate(14 280 240)"/>

  <!-- Main Flashcard -->
  <g filter="url(#glow)">
    <rect x="126" y="116" width="260" height="320" rx="32" fill="url(#cardGrad)"/>
    
    <!-- Accent Line on card -->
    <rect x="166" y="156" width="70" height="12" rx="6" fill="#6366f1"/>
    <rect x="166" y="180" width="120" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Prominent "Z" Letter for Zakerly -->
    <path d="M 180 230 L 332 230 L 210 350 L 332 350" fill="none" stroke="#4f46e5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Magic Sparkle -->
  <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120" fill="#fbbf24"/>
  <circle cx="150" cy="110" r="8" fill="#38bdf8"/>
</svg>

